version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_DB=university_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./sql:/docker-entrypoint-initdb.d/sql:ro
    ports:
      - "5432:5432"
    networks:
      - university_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d university_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
    name: university_postgres_data

networks:
  university_network:
    driver: bridge